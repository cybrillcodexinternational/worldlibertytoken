<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/css/style.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Main Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="header">
        <div class="container-fluid">
                <div class="row main-header">
                        <div class="col-md-2 logo-image">
                            <img src="assets/images/novax-logo.png" class="logo-img" />
                        </div>
                        <div class="col-md-7 navigation-area">
                            <div class="navigation">
                                <nav class="main-nav">
                                    <li class="navigation-item">Home</li>
                                    <li class="navigation-item">Tokenomics</li>
                                    <li class="navigation-item">Roadmap</li>
                                    <li class="navigation-item">Whitepapers</li>
                                    <li class="navigation-item">Echosystem</li>
                                    <li class="navigation-item">News</li>
                                    <li class="navigation-item">Blog</li>
                                    <li class="navigation-item">Faq</li>
                                </nav>
                            </div>
                        </div>
                        <div class="col-md-3 buttons-header">
                            <div class="h-buttons">
                                <button class="login-btn">Login</button>
                                <button class="colored-btn">CREATE Account <span></span></button>
                            </div>
                        </div>
                </div>
        </div>
    </section>
    <section class="home-hero">
        <div class="container-fluid">
            <div class="row main-hero-section">
                <div class="col-md-6 hero-text">
                    <div class="hero-text-area">
                        <div class="hero-subtitle">
                            Novax Coin
                        </div>
                        <div class="hero-title">
                            Building <br />The Next Era <br />Of Digital Values
                        </div>
                        <div class="hero-description">
                            NovaX Coin powers a modular ecosystem of decentralized tools, real utility, and a global community—<br />designed for what comes next.
                        </div>
                        <div class="hero-btns">
                            <button class="colored-button">Explore the echosystem</button>
                            <button class="bordered-button">Read Whitepapers</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 hero-video">
                    <div class="hero-image-coin">
                        <img src="assets/images/novax-coin.png" class="main-hero-coin" />
                    </div>
                </div> 
            </div>
        </div>
    </section>
    <section class="">
        
    </section>    

    <script src="https://kit.fontawesome.com/9d750fad66.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
